name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run CPU and client checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q skills/vvip/scripts
          cmp LICENSE skills/vvip/LICENSE
      - name: Build distributions
        if: matrix.python == '3.10'
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=vvip/ --output=dist/vvip-skill.zip HEAD:skills/vvip
          python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.10'
        with:
          name: vvip-distributions
          path: dist/
